---
# Dashboard Certificate (Both external and internal domains)
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wazuh-dashboard-tls
  namespace: wazuh
spec:
  secretName: wazuh-dashboard-tls
  issuerRef:
    name: vault-issuer
    kind: Issuer
  commonName: <path:secret/data/apps/wazuh#dashboard_external_url>
  dnsNames:
    - <path:secret/data/apps/wazuh#dashboard_external_url>
    - <path:secret/data/apps/wazuh#dashboard_internal_url>
  duration: 2160h # 90 days
  renewBefore: 720h # 30 days before expiration

---
# Wazuh API Certificate (Both external and internal domains)
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wazuh-api-tls
  namespace: wazuh
spec:
  secretName: wazuh-api-tls
  issuerRef:
    name: vault-issuer
    kind: Issuer
  commonName: <path:secret/data/apps/wazuh#api_external_url>
  dnsNames:
    - <path:secret/data/apps/wazuh#api_external_url>
    - <path:secret/data/apps/wazuh#api_internal_url>
  duration: 2160h # 90 days
  renewBefore: 720h # 30 days before expiration
