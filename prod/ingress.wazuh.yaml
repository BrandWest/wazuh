---
# Wazuh Dashboard Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wazuh-dashboard
  namespace: wazuh
  annotations:
    cert-manager.io/issuer: vault-issuer
    nginx.org/ssl-services: "dashboard"
    nginx.org/client-max-body-size: "50m"
    # Dashboard timeout settings for large config uploads
    nginx.org/proxy-connect-timeout: "600s"
    nginx.org/proxy-send-timeout: "600s"
    nginx.org/proxy-read-timeout: "600s"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - <path:argocd/data/argocd-vault-plugin/wazuh#dashboard_external_url>
        - <path:argocd/data/argocd-vault-plugin/wazuh#dashboard_internal_url>
      secretName: wazuh-dashboard-tls
  rules:
    # External access (diagon.cloud)
    - host: <path:argocd/data/argocd-vault-plugin/wazuh#dashboard_external_url>
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dashboard
                port:
                  number: 443
    # Internal access (diagon.ally)
    - host: <path:argocd/data/argocd-vault-plugin/wazuh#dashboard_internal_url>
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dashboard
                port:
                  number: 443

---
# Wazuh API Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wazuh-api
  namespace: wazuh
  annotations:
    cert-manager.io/issuer: vault-issuer
    nginx.org/ssl-services: "wazuh"
    nginx.org/client-max-body-size: "50m"
    # Wazuh API specific settings
    nginx.org/proxy-connect-timeout: "600s"
    nginx.org/proxy-send-timeout: "600s"
    nginx.org/proxy-read-timeout: "600s"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - <path:argocd/data/argocd-vault-plugin/wazuh#api_external_url>
        - <path:argocd/data/argocd-vault-plugin/wazuh#api_internal_url>
      secretName: wazuh-api-tls
  rules:
    # External access (diagon.cloud)
    - host: <path:argocd/data/argocd-vault-plugin/wazuh#api_external_url>
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wazuh
                port:
                  number: 55000
    # Internal access (diagon.ally)
    - host: <path:argocd/data/argocd-vault-plugin/wazuh#api_internal_url>
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wazuh
                port:
                  number: 55000
