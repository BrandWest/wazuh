apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: wazuh-indexer
  namespace: wazuh
spec:
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  podManagementPolicy: OrderedReady
  replicas: 2
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: wazuh-indexer
  serviceName: wazuh-indexer
  template:
    metadata:
      labels:
        app: wazuh-indexer
      name: wazuh-indexer
    spec:
      containers:
      - env:
        - name: OPENSEARCH_JAVA_OPTS
          value: -Xms2g -Xmx2g -Dlog4j2.formatMsgNoLookups=true
        - name: CLUSTER_NAME
          value: wazuh
        - name: NETWORK_HOST
          value: 0.0.0.0
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.name
        - name: DISCOVERY_SERVICE
          value: wazuh-indexer
        - name: KUBERNETES_NAMESPACE
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.namespace
        - name: DISABLE_INSTALL_DEMO_CONFIG
          value: 'true'
        image: wazuh/wazuh-indexer:4.14.0
        imagePullPolicy: IfNotPresent
        name: wazuh-indexer
        ports:
        - containerPort: 9200
          name: indexer-rest
          protocol: TCP
        - containerPort: 9300
          name: indexer-nodes
          protocol: TCP
        resources:
          limits:
            cpu: '2'
            memory: 4Gi
          requests:
            cpu: 800m
            memory: 2560Mi
        securityContext:
          capabilities:
            add:
            - SYS_CHROOT
          runAsGroup: 3000
          runAsUser: 1000
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /var/lib/wazuh-indexer
          name: wazuh-indexer
        - mountPath: /usr/share/wazuh-indexer/config/certs/node-key.pem
          name: indexer-certs
          readOnly: true
          subPath: node-key.pem
        - mountPath: /usr/share/wazuh-indexer/config/certs/node.pem
          name: indexer-certs
          readOnly: true
          subPath: node.pem
        - mountPath: /usr/share/wazuh-indexer/config/certs/root-ca.pem
          name: indexer-certs
          readOnly: true
          subPath: root-ca.pem
        - mountPath: /usr/share/wazuh-indexer/config/certs/admin.pem
          name: indexer-certs
          readOnly: true
          subPath: admin.pem
        - mountPath: /usr/share/wazuh-indexer/config/certs/admin-key.pem
          name: indexer-certs
          readOnly: true
          subPath: admin-key.pem
        - mountPath: /usr/share/wazuh-indexer/config/opensearch.yml
          name: indexer-conf
          readOnly: true
          subPath: opensearch.yml
        - mountPath: /usr/share/wazuh-indexer/config/opensearch-security/internal_users.yml
          name: indexer-conf
          readOnly: true
          subPath: internal_users.yml
      dnsPolicy: ClusterFirst
      initContainers:
      - command:
        - sh
        - -c
        - chown -R 1000:3000 /var/lib/wazuh-indexer
        image: busybox
        imagePullPolicy: Always
        name: volume-mount-hack
        resources:
          limits:
            cpu: 200m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 256Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /var/lib/wazuh-indexer
          name: wazuh-indexer
      - command:
        - sysctl
        - -w
        - vm.max_map_count=262144
        image: busybox
        imagePullPolicy: Always
        name: increase-the-vm-max-map-count
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 64Mi
        securityContext:
          privileged: true
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      - command:
        - sh
        - -c
        - |
          # Get pod ordinal from hostname (e.g., wazuh-indexer-0 -> 0)
          ORDINAL=${HOSTNAME##*-}
          echo "Setting up certificates for pod ordinal: $ORDINAL"

          # Copy node certificate for this specific pod
          cp /certs/node-$ORDINAL/tls.crt /certs-out/node.pem
          cp /certs/node-$ORDINAL/tls.key /certs-out/node-key.pem

          # Copy admin certificate (same for all pods)
          cp /certs/admin/tls.crt /certs-out/admin.pem
          cp /certs/admin/tls.key /certs-out/admin-key.pem

          # Copy root CA (same for all pods)
          cp /certs/ca/ca.crt /certs-out/root-ca.pem

          # Set proper permissions
          chmod 644 /certs-out/*

          echo "Certificates copied successfully"
          ls -la /certs-out/
        image: busybox
        imagePullPolicy: Always
        name: setup-certs
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 64Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /certs/node-0
          name: wazuh-indexer-0-cert
          readOnly: true
        - mountPath: /certs/node-1
          name: wazuh-indexer-1-cert
          readOnly: true
        - mountPath: /certs/admin
          name: wazuh-indexer-admin-cert
          readOnly: true
        - mountPath: /certs/ca
          name: wazuh-indexer-root-ca
          readOnly: true
        - mountPath: /certs-out
          name: indexer-certs
      nodeSelector:
        kubernetes.io/arch: amd64
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        fsGroup: 3000
      terminationGracePeriodSeconds: 30
      volumes:
      - name: indexer-certs
        emptyDir: {}
      - name: wazuh-indexer-0-cert
        secret:
          defaultMode: 384
          secretName: wazuh-indexer-0-cert
      - name: wazuh-indexer-1-cert
        secret:
          defaultMode: 384
          secretName: wazuh-indexer-1-cert
      - name: wazuh-indexer-admin-cert
        secret:
          defaultMode: 384
          secretName: wazuh-indexer-admin-cert
      - name: wazuh-indexer-root-ca
        secret:
          defaultMode: 384
          secretName: wazuh-indexer-root-ca
      - configMap:
          defaultMode: 384
          name: indexer-conf
        name: indexer-conf
  updateStrategy:
    rollingUpdate:
      partition: 0
    type: RollingUpdate
  volumeClaimTemplates:
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: wazuh-indexer
      namespace: indexer-cluster
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 50Gi
      storageClassName: wazuh-storage
      volumeMode: Filesystem
    status:
      phase: Pending
  availableReplicas: 3
  collisionCount: 0
  currentReplicas: 3
  currentRevision: wazuh-indexer-55c97659bf
  observedGeneration: 3
  readyReplicas: 3
  updateRevision: wazuh-indexer-55c97659bf
  updatedReplicas: 3
