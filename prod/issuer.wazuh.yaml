apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: vault-issuer
  namespace: wazuh
  annotations:
    avp.kubernetes.io/path: "argocd/data/argocd-vault-plugin/vault"
spec:
  vault:
    server: <vault_url>
    path: <pki_sign_int_path>
    auth:
      kubernetes:
        mountPath: /v1/auth/kubernetes
        role: cert-manager
        serviceAccountRef:
          name: cert-manager
