apiVersion: v1
data:
  opensearch_dashboards.yml: '

    server.host: 0.0.0.0

    server.port: 5601

    opensearch.hosts: https://indexer:9200

    opensearch.ssl.verificationMode: none

    opensearch.requestHeadersAllowlist: [ authorization,securitytenant ]

    opensearch_security.multitenancy.enabled: false

    opensearch_security.readonly_mode.roles: ["kibana_read_only"]

    server.ssl.enabled: true

    server.ssl.key: "/usr/share/wazuh-dashboard/certs/tls.key"

    server.ssl.certificate: "/usr/share/wazuh-dashboard/certs/tls.crt"

    opensearch.ssl.certificateAuthorities: ["/usr/share/wazuh-dashboard/certs/ca.crt"]

    uiSettings.overrides.defaultRoute: /app/wz-home

    # Session expiration settings

    opensearch_security.cookie.ttl: 900000

    opensearch_security.session.ttl: 900000

    opensearch_security.session.keepalive: true

    '
kind: ConfigMap
metadata:
  name: dashboard-conf
  namespace: wazuh
---
apiVersion: v1
data:
  internal_users.yml: "---\n# This is the internal user database\n# The hash value\
    \ is a bcrypt hash and can be generated with plugin/tools/hash.sh\n\n_meta:\n\
    \  type: \"internalusers\"\n  config_version: 2\n\n# Define your internal users\
    \ here\n\n## Demo users\n\nadmin:\n  hash: \"<path:argocd/data/argocd-vault-plugin/wazuh#admin_password_hash>\"\
    \n  reserved: true\n  backend_roles:\n  - \"admin\"\n  description: \"Demo admin\
    \ user\"\n\nkibanaserver:\n  hash: \"<path:argocd/data/argocd-vault-plugin/wazuh#kibanaserver_password_hash>\"\
    \n  reserved: true\n  description: \"Demo kibanaserver user\"\n\nkibanaro:\n \
    \ hash: \"$2a$12$JJSXNfTowz7Uu5ttXfeYpeYE0arACvcwlPBStB1F.MI7f0U9Z4DGC\"\n  reserved:\
    \ false\n  backend_roles:\n  - \"kibanauser\"\n  - \"readall\"\n  attributes:\n\
    \    attribute1: \"value1\"\n    attribute2: \"value2\"\n    attribute3: \"value3\"\
    \n  description: \"Demo kibanaro user\"\n\nlogstash:\n  hash: \"$2a$12$u1ShR4l4uBS3Uv59Pa2y5.1uQuZBrZtmNfqB3iM/.jL0XoV9sghS2\"\
    \n  reserved: false\n  backend_roles:\n  - \"logstash\"\n  description: \"Demo\
    \ logstash user\"\n\nreadall:\n  hash: \"$2a$12$ae4ycwzwvLtZxwZ82RmiEunBbIPiAmGZduBAjKN0TXdwQFtCwARz2\"\
    \n  reserved: false\n  backend_roles:\n  - \"readall\"\n  description: \"Demo\
    \ readall user\"\n\nsnapshotrestore:\n  hash: \"$2y$12$DpwmetHKwgYnorbgdvORCenv4NAK8cPUg8AI6pxLCuWf/ALc0.v7W\"\
    \n  reserved: false\n  backend_roles:\n  - \"snapshotrestore\"\n  description:\
    \ \"Demo snapshotrestore user\"\n"
  opensearch.yml: "cluster.name: ${CLUSTER_NAME}\nnode.name: ${NODE_NAME}\nnetwork.host:\
    \ ${NETWORK_HOST}\ndiscovery.seed_hosts:\n\
    \  - wazuh-indexer-0.wazuh-indexer\n\
    \  - wazuh-indexer-1.wazuh-indexer\ncluster.initial_cluster_manager_nodes:\n\
    \  - wazuh-indexer-0\n\
    \  - wazuh-indexer-1\n\n# Allow Filebeat 7.10.2 to work with OpenSearch 2.x\n\
    compatibility.override_main_response_version: true\n\nnode.max_local_storage_nodes:\
    \ \"2\"\npath.data: /var/lib/wazuh-indexer\npath.logs: /var/log/wazuh-indexer\n\
    plugins.security.ssl.http.pemcert_filepath: /usr/share/wazuh-indexer/config/certs/node.pem\n\
    plugins.security.ssl.http.pemkey_filepath: /usr/share/wazuh-indexer/config/certs/node-key.pem\n\
    plugins.security.ssl.http.pemtrustedcas_filepath: /usr/share/wazuh-indexer/config/certs/root-ca.pem\n\
    plugins.security.ssl.transport.pemcert_filepath: /usr/share/wazuh-indexer/config/certs/node.pem\n\
    plugins.security.ssl.transport.pemkey_filepath: /usr/share/wazuh-indexer/config/certs/node-key.pem\n\
    plugins.security.ssl.transport.pemtrustedcas_filepath: /usr/share/wazuh-indexer/config/certs/root-ca.pem\n\
    plugins.security.ssl.http.enabled: true\nplugins.security.ssl.transport.enforce_hostname_verification:\
    \ false\nplugins.security.ssl.transport.resolve_hostname: false\nplugins.security.authcz.admin_dn:\n\
    \  - CN=admin,O=Company,L=California,C=US\nplugins.security.check_snapshot_restore_write_privileges:\
    \ true\nplugins.security.enable_snapshot_restore_privilege: true\nplugins.security.nodes_dn:\n\
    \  - CN=wazuh-indexer-0.wazuh-indexer.wazuh.svc.cluster.local\n\
    \  - CN=wazuh-indexer-1.wazuh-indexer.wazuh.svc.cluster.local\nplugins.security.restapi.roles_enabled:\n\
    - \"all_access\"\n- \"security_rest_api_access\"\nplugins.security.allow_default_init_securityindex:\
    \ true\ncluster.routing.allocation.disk.threshold_enabled: false"
kind: ConfigMap
metadata:
  name: indexer-conf
  namespace: wazuh
---
apiVersion: v1
data:
  conductor.conf: "<!--\n  Wazuh - Manager - Default configuration for ubuntu 16.04\n\
    \  More info at: https://documentation.wazuh.com\n  Mailing list: https://groups.google.com/forum/#!forum/wazuh\n\
    \n  Customization: TCP on port 1514\n  Customization: Cluster mode enabled, master\
    \ node\n-->\n<ossec_config>\n  <global>\n    <jsonout_output>yes</jsonout_output>\n\
    \    <alerts_log>yes</alerts_log>\n    <logall>no</logall>\n    <logall_json>no</logall_json>\n\
    \    <email_notification>no</email_notification>\n    <smtp_server>smtp.example.wazuh.com</smtp_server>\n\
    \    <email_from>ossecm@example.wazuh.com</email_from>\n    <email_to>recipient@example.wazuh.com</email_to>\n\
    \    <email_maxperhour>12</email_maxperhour>\n    <email_log_source>alerts.log</email_log_source>\n\
    \    <queue_size>131072</queue_size>\n    <agents_disconnection_time>20s</agents_disconnection_time>\n\
    \    <agents_disconnection_alert_time>100s</agents_disconnection_alert_time>\n\
    \  </global>\n\n  <!-- Choose between \"plain\", \"json\", or \"plain,json\" for\
    \ the format of internal logs -->\n  <logging>\n    <log_format>plain</log_format>\n\
    \  </logging>\n\n  <remote>\n    <connection>secure</connection>\n    <port>1514</port>\n\
    \    <protocol>tcp</protocol>\n    <queue_size>131072</queue_size>\n  </remote>\n\
    \n  <!-- Policy monitoring -->\n  <rootcheck>\n    <disabled>no</disabled>\n \
    \   <check_unixaudit>yes</check_unixaudit>\n    <check_files>yes</check_files>\n\
    \    <check_trojans>yes</check_trojans>\n    <check_dev>yes</check_dev>\n    <check_sys>yes</check_sys>\n\
    \    <check_pids>yes</check_pids>\n    <check_ports>yes</check_ports>\n    <check_if>yes</check_if>\n\
    \n    <!-- Frequency that rootcheck is executed - every 12 hours -->\n    <frequency>43200</frequency>\n\
    \n    <rootkit_files>/var/ossec/etc/rootcheck/rootkit_files.txt</rootkit_files>\n\
    \    <rootkit_trojans>/var/ossec/etc/rootcheck/rootkit_trojans.txt</rootkit_trojans>\n\
    \n    <system_audit>/var/ossec/etc/rootcheck/system_audit_rcl.txt</system_audit>\n\
    \    <system_audit>/var/ossec/etc/rootcheck/system_audit_ssh.txt</system_audit>\n\
    \n    <skip_nfs>yes</skip_nfs>\n  </rootcheck>\n\n  <wodle name=\"open-scap\"\
    >\n    <disabled>yes</disabled>\n    <timeout>1800</timeout>\n    <interval>1d</interval>\n\
    \    <scan-on-start>yes</scan-on-start>\n  </wodle>\n\n  <wodle name=\"cis-cat\"\
    >\n    <disabled>yes</disabled>\n    <timeout>1800</timeout>\n    <interval>1d</interval>\n\
    \    <scan-on-start>yes</scan-on-start>\n\n    <java_path>wodles/java</java_path>\n\
    \    <ciscat_path>wodles/ciscat</ciscat_path>\n  </wodle>\n\n  <!-- Osquery integration\
    \ -->\n  <wodle name=\"osquery\">\n    <disabled>yes</disabled>\n    <run_daemon>yes</run_daemon>\n\
    \    <log_path>/var/log/osquery/osqueryd.results.log</log_path>\n    <config_path>/etc/osquery/osquery.conf</config_path>\n\
    \    <add_labels>yes</add_labels>\n  </wodle>\n\n  <!-- System inventory -->\n\
    \  <wodle name=\"syscollector\">\n    <disabled>no</disabled>\n    <interval>1h</interval>\n\
    \    <scan_on_start>yes</scan_on_start>\n    <hardware>yes</hardware>\n    <os>yes</os>\n\
    \    <network>yes</network>\n    <packages>yes</packages>\n    <ports all=\"yes\"\
    >yes</ports>\n    <processes>yes</processes>\n  </wodle>\n\n  <vulnerability-detection>\n\
    \    <enabled>yes</enabled>\n    <index-status>yes</index-status>\n    <feed-update-interval>60m</feed-update-interval>\n\
    \  </vulnerability-detection>\n\n  <indexer>\n    <enabled>yes</enabled>\n   \
    \ <hosts>\n      <host>https://indexer:9200</host>\n    </hosts>\n    <ssl>\n\
    \      <certificate_authorities>\n        <ca>/etc/ssl/root-ca.pem</ca>\n    \
    \  </certificate_authorities>\n      <certificate>/etc/ssl/filebeat.pem</certificate>\n\
    \      <key>/etc/ssl/filebeat.key</key>\n    </ssl>\n  </indexer>\n\n  <!-- File\
    \ integrity monitoring -->\n  <syscheck>\n    <disabled>no</disabled>\n\n    <!--\
    \ Frequency that syscheck is executed default every 12 hours -->\n    <frequency>43200</frequency>\n\
    \n    <scan_on_start>yes</scan_on_start>\n\n    <!-- Generate alert when new file\
    \ detected -->\n    <alert_new_files>yes</alert_new_files>\n\n    <!-- Don't ignore\
    \ files that change more than 'frequency' times -->\n    <auto_ignore frequency=\"\
    10\" timeframe=\"3600\">no</auto_ignore>\n\n    <!-- Directories to check  (perform\
    \ all possible verifications) -->\n    <directories check_all=\"yes\">/etc,/usr/bin,/usr/sbin</directories>\n\
    \    <directories check_all=\"yes\">/bin,/sbin,/boot</directories>\n\n    <!--\
    \ Files/directories to ignore -->\n    <ignore>/etc/mtab</ignore>\n    <ignore>/etc/hosts.deny</ignore>\n\
    \    <ignore>/etc/mail/statistics</ignore>\n    <ignore>/etc/random-seed</ignore>\n\
    \    <ignore>/etc/random.seed</ignore>\n    <ignore>/etc/adjtime</ignore>\n  \
    \  <ignore>/etc/httpd/logs</ignore>\n    <ignore>/etc/utmpx</ignore>\n    <ignore>/etc/wtmpx</ignore>\n\
    \    <ignore>/etc/cups/certs</ignore>\n    <ignore>/etc/dumpdates</ignore>\n \
    \   <ignore>/etc/svc/volatile</ignore>\n    <ignore>/sys/kernel/security</ignore>\n\
    \    <ignore>/sys/kernel/debug</ignore>\n\n    <!-- Check the file, but never\
    \ compute the diff -->\n    <nodiff>/etc/ssl/private.key</nodiff>\n\n    <skip_nfs>yes</skip_nfs>\n\
    \n    <!-- Remove not monitored files -->\n    <remove_old_diff>yes</remove_old_diff>\n\
    \n    <!-- Allow the system to restart Auditd after installing the plugin -->\n\
    \    <restart_audit>yes</restart_audit>\n  </syscheck>\n\n  <!-- Active response\
    \ -->\n  <global>\n    <white_list>127.0.0.1</white_list>\n    <white_list>^localhost.localdomain$</white_list>\n\
    \    <white_list>10.66.0.2</white_list>\n  </global>\n\n  <command>\n    <name>disable-account</name>\n\
    \    <executable>disable-account.sh</executable>\n    <expect>user</expect>\n\
    \    <timeout_allowed>yes</timeout_allowed>\n  </command>\n\n  <command>\n   \
    \ <name>restart-ossec</name>\n    <executable>restart-ossec.sh</executable>\n\
    \    <expect></expect>\n  </command>\n\n  <command>\n    <name>firewall-drop</name>\n\
    \    <executable>firewall-drop</executable>\n    <timeout_allowed>yes</timeout_allowed>\n\
    \  </command>\n\n  <command>\n    <name>host-deny</name>\n    <executable>host-deny.sh</executable>\n\
    \    <expect>srcip</expect>\n    <timeout_allowed>yes</timeout_allowed>\n  </command>\n\
    \n  <command>\n    <name>route-null</name>\n    <executable>route-null.sh</executable>\n\
    \    <expect>srcip</expect>\n    <timeout_allowed>yes</timeout_allowed>\n  </command>\n\
    \n  <command>\n    <name>win_route-null</name>\n    <executable>route-null.cmd</executable>\n\
    \    <expect>srcip</expect>\n    <timeout_allowed>yes</timeout_allowed>\n  </command>\n\
    \n  <command>\n    <name>win_route-null-2012</name>\n    <executable>route-null-2012.cmd</executable>\n\
    \    <expect>srcip</expect>\n    <timeout_allowed>yes</timeout_allowed>\n  </command>\n\
    \n  <command>\n    <name>netsh</name>\n    <executable>netsh.cmd</executable>\n\
    \    <expect>srcip</expect>\n    <timeout_allowed>yes</timeout_allowed>\n  </command>\n\
    \n  <command>\n    <name>netsh-win-2016</name>\n    <executable>netsh-win-2016.cmd</executable>\n\
    \    <expect>srcip</expect>\n    <timeout_allowed>yes</timeout_allowed>\n  </command>\n\
    \n  <!--\n  <active-response>\n    active-response options here\n  </active-response>\n\
    \  -->\n\n  <!-- Log analysis -->\n  <localfile>\n    <log_format>command</log_format>\n\
    \    <command>df -P</command>\n    <frequency>360</frequency>\n  </localfile>\n\
    \n  <localfile>\n    <log_format>full_command</log_format>\n    <command>netstat\
    \ -tulpn | sed 's/\\([[:alnum:]]\\+\\)\\ \\+[[:digit:]]\\+\\ \\+[[:digit:]]\\\
    +\\ \\+\\(.*\\):\\([[:digit:]]*\\)\\ \\+\\([0-9\\.\\:\\*]\\+\\).\\+\\ \\([[:digit:]]*\\\
    /[[:alnum:]\\-]*\\).*/\\1 \\2 == \\3 == \\4 \\5/' | sort -k 4 -g | sed 's/ ==\
    \ \\(.*\\) ==/:\\1/' | sed 1,2d</command>\n    <alias>netstat listening ports</alias>\n\
    \    <frequency>360</frequency>\n  </localfile>\n\n  <localfile>\n    <log_format>full_command</log_format>\n\
    \    <command>last -n 20</command>\n    <frequency>360</frequency>\n  </localfile>\n\
    \n  <ruleset>\n    <!-- Default ruleset -->\n    <decoder_dir>ruleset/decoders</decoder_dir>\n\
    \    <rule_dir>ruleset/rules</rule_dir>\n    <rule_exclude>0215-policy_rules.xml</rule_exclude>\n\
    \    <list>etc/lists/audit-keys</list>\n    <list>etc/lists/amazon/aws-sources</list>\n\
    \    <list>etc/lists/amazon/aws-eventnames</list>\n    <list>etc/lists/malicious-ioc/malicious-ip</list>\n\
    \    <list>etc/lists/malicious-ioc/malicious-domains</list>\n    <list>etc/lists/malicious-ioc/malware-hashes</list>\n\
    \n    <!-- User-defined ruleset -->\n    <decoder_dir>etc/decoders</decoder_dir>\n\
    \    <rule_dir>etc/rules</rule_dir>\n  </ruleset>\n\n  <!-- Configuration for\
    \ ossec-authd\n    To enable this service, run:\n    wazuh-control enable auth\n\
    \  -->\n  <auth>\n    <disabled>no</disabled>\n    <port>1515</port>\n    <use_source_ip>no</use_source_ip>\n\
    \    <force>\n      <enabled>yes</enabled>\n      <key_mismatch>yes</key_mismatch>\n\
    \      <disconnected_time enabled=\"yes\">1h</disconnected_time>\n      <after_registration_time>1h</after_registration_time>\n\
    \    </force>\n    <purge>no</purge>\n    <use_password>yes</use_password>\n \
    \   <ciphers>HIGH:!ADH:!EXP:!MD5:!RC4:!3DES:!CAMELLIA:@STRENGTH</ciphers>\n  \
    \  <!-- <ssl_agent_ca></ssl_agent_ca> -->\n    <ssl_verify_host>no</ssl_verify_host>\n\
    \    <ssl_manager_cert>/var/ossec/etc/sslmanager.cert</ssl_manager_cert>\n   \
    \ <ssl_manager_key>/var/ossec/etc/sslmanager.key</ssl_manager_key>\n    <ssl_auto_negotiate>no</ssl_auto_negotiate>\n\
    \  </auth>\n\n  <cluster>\n    <name>wazuh</name>\n    <node_name>wazuh-manager-conductor</node_name>\n\
    \    <node_type>master</node_type>\n    <key>to_be_replaced_by_cluster_key</key>\n\
    \    <port>1516</port>\n    <bind_addr>0.0.0.0</bind_addr>\n    <nodes>\n    \
    \    <node>wazuh-manager-conductor-0.wazuh-cluster.wazuh</node>\n    </nodes>\n\
    \    <hidden>no</hidden>\n    <disabled>no</disabled>\n  </cluster>\n</ossec_config>\n\
    \n<ossec_config>\n  <localfile>\n    <log_format>syslog</log_format>\n    <location>/var/ossec/logs/active-responses.log</location>\n\
    \  </localfile>\n\n</ossec_config>\n"
