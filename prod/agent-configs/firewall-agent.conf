<!-- Wazuh Agent Configuration for Firewalls (pfSense, OPNsense, etc.) -->
<agent_config>
  <!-- Profile for firewall devices -->
  <profile>firewall</profile>

  <localfile>
    <!-- Monitor firewall logs -->
    <log_format>syslog</log_format>
    <location>/var/log/filter.log</location>
  </localfile>

  <localfile>
    <!-- Monitor authentication logs -->
    <log_format>syslog</log_format>
    <location>/var/log/auth.log</location>
  </localfile>

  <localfile>
    <!-- Monitor system logs -->
    <log_format>syslog</log_format>
    <location>/var/log/system.log</location>
  </localfile>

  <localfile>
    <!-- Monitor DHCP logs -->
    <log_format>syslog</log_format>
    <location>/var/log/dhcpd.log</location>
  </localfile>

  <localfile>
    <!-- Monitor VPN logs (OpenVPN/IPsec) -->
    <log_format>syslog</log_format>
    <location>/var/log/openvpn.log</location>
  </localfile>

  <localfile>
    <!-- Monitor web interface access -->
    <log_format>syslog</log_format>
    <location>/var/log/nginx/access.log</location>
  </localfile>

  <syscheck>
    <!-- File integrity monitoring for firewall configs -->
    <disabled>no</disabled>
    <frequency>43200</frequency> <!-- Every 12 hours -->
    <scan_on_start>yes</scan_on_start>

    <!-- Monitor firewall configuration files -->
    <directories check_all="yes" realtime="yes">/conf</directories>
    <directories check_all="yes" realtime="yes">/etc/rc.conf.local</directories>
    <directories check_all="yes" realtime="yes">/etc/hosts</directories>

    <!-- Ignore temporary files -->
    <ignore>/conf/backup</ignore>
    <ignore>/conf/sshd</ignore>
  </syscheck>

  <rootcheck>
    <!-- Rootkit detection -->
    <disabled>no</disabled>
    <frequency>86400</frequency> <!-- Daily -->
  </rootcheck>

  <sca>
    <!-- Security configuration assessment -->
    <enabled>yes</enabled>
    <scan_on_start>yes</scan_on_start>
    <interval>12h</interval>
    <skip_nfs>yes</skip_nfs>
  </sca>

  <wodle name="syscollector">
    <!-- System inventory -->
    <disabled>no</disabled>
    <interval>1h</interval>
    <network>yes</network>
    <os>yes</os>
    <packages>yes</packages>
    <ports all="yes">yes</ports>
    <processes>yes</processes>
  </wodle>

  <wodle name="vulnerability-detector">
    <!-- Vulnerability scanning -->
    <disabled>no</disabled>
    <interval>12h</interval>
    <run_on_start>yes</run_on_start>
  </wodle>

  <!-- Active response disabled for firewalls to prevent blocking critical services -->
  <active-response>
    <disabled>yes</disabled>
  </active-response>

  <labels>
    <label key="device_type">firewall</label>
    <label key="criticality">high</label>
  </labels>
</agent_config>
