<!-- Wazuh Agent Configuration for Servers (Linux/Unix) -->
<agent_config>
  <!-- Profile for server workloads -->
  <profile>server,linux</profile>

  <client_buffer>
    <!-- Standard buffer for server logs -->
    <disabled>no</disabled>
    <queue_size>5000</queue_size>
    <events_per_second>250</events_per_second>
  </client_buffer>

  <localfile>
    <!-- System logs -->
    <log_format>syslog</log_format>
    <location>/var/log/syslog</location>
  </localfile>

  <localfile>
    <!-- Authentication logs -->
    <log_format>syslog</log_format>
    <location>/var/log/auth.log</location>
  </localfile>

  <localfile>
    <!-- Kernel messages -->
    <log_format>syslog</log_format>
    <location>/var/log/kern.log</location>
  </localfile>

  <localfile>
    <!-- Application messages -->
    <log_format>syslog</log_format>
    <location>/var/log/messages</location>
  </localfile>

  <localfile>
    <!-- Secure logs (RedHat/CentOS) -->
    <log_format>syslog</log_format>
    <location>/var/log/secure</location>
  </localfile>

  <localfile>
    <!-- Apache access logs -->
    <log_format>apache</log_format>
    <location>/var/log/apache2/access.log</location>
  </localfile>

  <localfile>
    <!-- Apache error logs -->
    <log_format>apache</log_format>
    <location>/var/log/apache2/error.log</location>
  </localfile>

  <localfile>
    <!-- Nginx access logs -->
    <log_format>nginx</log_format>
    <location>/var/log/nginx/access.log</location>
  </localfile>

  <localfile>
    <!-- Nginx error logs -->
    <log_format>nginx</log_format>
    <location>/var/log/nginx/error.log</location>
  </localfile>

  <localfile>
    <!-- MySQL/MariaDB logs -->
    <log_format>mysql_log</log_format>
    <location>/var/log/mysql/error.log</location>
  </localfile>

  <localfile>
    <!-- PostgreSQL logs -->
    <log_format>postgresql_log</log_format>
    <location>/var/log/postgresql/postgresql-*.log</location>
  </localfile>

  <localfile>
    <!-- SSH daemon logs -->
    <log_format>syslog</log_format>
    <location>/var/log/openssh.log</location>
  </localfile>

  <localfile>
    <!-- Fail2ban logs -->
    <log_format>syslog</log_format>
    <location>/var/log/fail2ban.log</location>
  </localfile>

  <localfile>
    <!-- Audit logs -->
    <log_format>audit</log_format>
    <location>/var/log/audit/audit.log</location>
  </localfile>

  <syscheck>
    <!-- Comprehensive file integrity monitoring -->
    <disabled>no</disabled>
    <frequency>43200</frequency> <!-- Every 12 hours -->
    <scan_on_start>yes</scan_on_start>

    <!-- System directories -->
    <directories check_all="yes" realtime="yes">/etc</directories>
    <directories check_all="yes">/usr/bin</directories>
    <directories check_all="yes">/usr/sbin</directories>
    <directories check_all="yes">/bin</directories>
    <directories check_all="yes">/sbin</directories>
    <directories check_all="yes">/boot</directories>

    <!-- Web directories -->
    <directories check_all="yes" realtime="yes">/var/www</directories>
    <directories check_all="yes" realtime="yes">/srv/www</directories>

    <!-- Application directories -->
    <directories check_all="yes" realtime="yes">/opt</directories>
    <directories check_all="yes" realtime="yes">/usr/local</directories>

    <!-- SSH configuration -->
    <directories check_all="yes" realtime="yes">/root/.ssh</directories>
    <directories check_all="yes" realtime="yes">/home/*/.ssh</directories>

    <!-- Systemd service files -->
    <directories check_all="yes" realtime="yes">/etc/systemd/system</directories>
    <directories check_all="yes" realtime="yes">/lib/systemd/system</directories>

    <!-- Cron jobs -->
    <directories check_all="yes" realtime="yes">/etc/cron.d</directories>
    <directories check_all="yes" realtime="yes">/etc/cron.daily</directories>
    <directories check_all="yes" realtime="yes">/etc/cron.hourly</directories>
    <directories check_all="yes" realtime="yes">/etc/cron.monthly</directories>
    <directories check_all="yes" realtime="yes">/etc/cron.weekly</directories>
    <directories check_all="yes" realtime="yes">/var/spool/cron</directories>

    <!-- Ignore frequently changing files -->
    <ignore>/etc/mtab</ignore>
    <ignore>/etc/hosts.deny</ignore>
    <ignore>/etc/mail/statistics</ignore>
    <ignore>/etc/random-seed</ignore>
    <ignore>/etc/adjtime</ignore>
    <ignore>/etc/dnf</ignore>
    <ignore>/etc/prelink.cache</ignore>
  </syscheck>

  <rootcheck>
    <!-- Comprehensive rootkit detection -->
    <disabled>no</disabled>
    <frequency>43200</frequency> <!-- Every 12 hours -->
    <check_dev>yes</check_dev>
    <check_files>yes</check_files>
    <check_if>yes</check_if>
    <check_pids>yes</check_pids>
    <check_ports>yes</check_ports>
    <check_sys>yes</check_sys>
    <check_trojans>yes</check_trojans>
    <check_unixaudit>yes</check_unixaudit>
    <check_winapps>no</check_winapps>
    <check_winaudit>no</check_winaudit>
    <check_winmalware>no</check_winmalware>
  </rootcheck>

  <sca>
    <!-- Security configuration assessment -->
    <enabled>yes</enabled>
    <scan_on_start>yes</scan_on_start>
    <interval>12h</interval>
    <skip_nfs>yes</skip_nfs>

    <policies>
      <policy>cis_debian_linux.yml</policy>
      <policy>cis_rhel7_linux.yml</policy>
      <policy>cis_rhel8_linux.yml</policy>
      <policy>cis_ubuntu.yml</policy>
      <policy>sca_unix_audit.yml</policy>
    </policies>
  </sca>

  <wodle name="syscollector">
    <!-- Comprehensive system inventory -->
    <disabled>no</disabled>
    <interval>1h</interval>
    <network>yes</network>
    <os>yes</os>
    <packages>yes</packages>
    <ports all="yes">yes</ports>
    <processes>yes</processes>
    <hotfixes>yes</hotfixes>
  </wodle>

  <wodle name="vulnerability-detector">
    <!-- Vulnerability scanning -->
    <disabled>no</disabled>
    <interval>6h</interval>
    <run_on_start>yes</run_on_start>
    <ignore_time>6h</ignore_time>
  </wodle>

  <wodle name="osquery">
    <!-- osquery integration for advanced queries -->
    <disabled>no</disabled>
    <run_daemon>yes</run_daemon>
    <log_path>/var/log/osquery/osqueryd.results.log</log_path>
    <config_path>/etc/osquery/osquery.conf</config_path>
    <add_labels>yes</add_labels>
  </wodle>

  <wodle name="command">
    <!-- Monitor listening ports -->
    <disabled>no</disabled>
    <tag>netstat_listening</tag>
    <command>netstat -tulpn</command>
    <interval>5m</interval>
    <ignore_output>no</ignore_output>
    <run_on_start>yes</run_on_start>
    <timeout>60</timeout>
  </wodle>

  <wodle name="command">
    <!-- Monitor active network connections -->
    <disabled>no</disabled>
    <tag>netstat_established</tag>
    <command>netstat -nputw | grep ESTABLISHED</command>
    <interval>5m</interval>
    <ignore_output>no</ignore_output>
    <run_on_start>yes</run_on_start>
    <timeout>60</timeout>
  </wodle>

  <wodle name="command">
    <!-- Monitor failed login attempts -->
    <disabled>no</disabled>
    <tag>failed_logins</tag>
    <command>grep "Failed password" /var/log/auth.log | tail -50</command>
    <interval>10m</interval>
    <ignore_output>no</ignore_output>
    <run_on_start>yes</run_on_start>
    <timeout>60</timeout>
  </wodle>

  <wodle name="command">
    <!-- Monitor sudo usage -->
    <disabled>no</disabled>
    <tag>sudo_usage</tag>
    <command>grep "sudo:" /var/log/auth.log | tail -50</command>
    <interval>10m</interval>
    <ignore_output>no</ignore_output>
    <run_on_start>yes</run_on_start>
    <timeout>60</timeout>
  </wodle>

  <active-response>
    <!-- Enable active response -->
    <disabled>no</disabled>
    <ca_store>/var/ossec/etc/wpk_root.pem</ca_store>
    <ca_verification>yes</ca_verification>
  </active-response>

  <!-- Active response commands -->
  <command>
    <name>firewall-drop</name>
    <executable>firewall-drop</executable>
    <timeout_allowed>yes</timeout_allowed>
  </command>

  <command>
    <name>disable-account</name>
    <executable>disable-account</executable>
    <timeout_allowed>yes</timeout_allowed>
  </command>

  <!-- Active response rules -->
  <active-response>
    <command>firewall-drop</command>
    <location>local</location>
    <rules_id>5710,5711,5712,5720</rules_id> <!-- SSH brute force -->
    <timeout>600</timeout>
  </active-response>

  <active-response>
    <command>firewall-drop</command>
    <location>local</location>
    <rules_id>31100,31101,31102,31103,31104</rules_id> <!-- Web attacks -->
    <timeout>600</timeout>
  </active-response>

  <labels>
    <label key="device_type">server</label>
    <label key="os_type">linux</label>
    <label key="criticality">high</label>
    <label key="environment">production</label>
  </labels>
</agent_config>
