<!-- Wazuh Agent Configuration for Endpoints (Laptops, Workstations, Desktop Computers) -->
<agent_config>
  <!-- Profile for endpoint devices -->
  <profile>endpoint,workstation,laptop</profile>

  <client_buffer>
    <!-- Standard buffer for endpoint events -->
    <disabled>no</disabled>
    <queue_size>5000</queue_size>
    <events_per_second>200</events_per_second>
  </client_buffer>

  <!-- ========================================
       SYSTEM LOGS - LINUX/MAC
       ======================================== -->

  <localfile>
    <!-- System logs (Linux) -->
    <log_format>syslog</log_format>
    <location>/var/log/syslog</location>
  </localfile>

  <localfile>
    <!-- System logs (Mac) -->
    <log_format>macos</log_format>
    <location>/var/log/system.log</location>
  </localfile>

  <localfile>
    <!-- Authentication logs (Linux) -->
    <log_format>syslog</log_format>
    <location>/var/log/auth.log</location>
  </localfile>

  <localfile>
    <!-- Secure logs (RedHat/CentOS) -->
    <log_format>syslog</log_format>
    <location>/var/log/secure</location>
  </localfile>

  <localfile>
    <!-- Kernel messages -->
    <log_format>syslog</log_format>
    <location>/var/log/kern.log</location>
  </localfile>

  <localfile>
    <!-- Application messages -->
    <log_format>syslog</log_format>
    <location>/var/log/messages</location>
  </localfile>

  <!-- ========================================
       WINDOWS EVENT LOGS
       ======================================== -->

  <localfile>
    <!-- Windows Security events -->
    <location>Security</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <localfile>
    <!-- Windows System events -->
    <location>System</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <localfile>
    <!-- Windows Application events -->
    <location>Application</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <localfile>
    <!-- Windows PowerShell logs -->
    <location>Microsoft-Windows-PowerShell/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <localfile>
    <!-- Windows Defender logs -->
    <location>Microsoft-Windows-Windows Defender/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <localfile>
    <!-- Windows Firewall logs -->
    <location>Microsoft-Windows-Windows Firewall With Advanced Security/Firewall</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <localfile>
    <!-- Sysmon events (if installed) -->
    <location>Microsoft-Windows-Sysmon/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- ========================================
       BROWSER & APPLICATION LOGS
       ======================================== -->

  <localfile>
    <!-- Firefox crash reports (Linux) -->
    <log_format>syslog</log_format>
    <location>/home/*/.mozilla/firefox/Crash Reports/*.txt</location>
  </localfile>

  <localfile>
    <!-- Chrome crash reports (Linux) -->
    <log_format>syslog</log_format>
    <location>/home/*/.config/google-chrome/Crash Reports/*.txt</location>
  </localfile>

  <!-- ========================================
       USER ACTIVITY MONITORING
       ======================================== -->

  <localfile>
    <!-- User command history (bash) - DISABLED by default for privacy -->
    <!-- Uncomment if required for forensics
    <log_format>syslog</log_format>
    <location>/home/*/.bash_history</location>
    -->
  </localfile>

  <localfile>
    <!-- Sudo usage logs -->
    <log_format>syslog</log_format>
    <location>/var/log/sudo.log</location>
  </localfile>

  <!-- ========================================
       VPN & REMOTE ACCESS
       ======================================== -->

  <localfile>
    <!-- OpenVPN logs -->
    <log_format>syslog</log_format>
    <location>/var/log/openvpn.log</location>
  </localfile>

  <localfile>
    <!-- Cisco AnyConnect logs (Windows) -->
    <log_format>syslog</log_format>
    <location>C:\ProgramData\Cisco\Cisco AnyConnect Secure Mobility Client\Logs\*.log</location>
  </localfile>

  <!-- ========================================
       FILE INTEGRITY MONITORING
       ======================================== -->

  <syscheck>
    <disabled>no</disabled>
    <frequency>43200</frequency> <!-- Every 12 hours -->
    <scan_on_start>yes</scan_on_start>

    <!-- LINUX/MAC DIRECTORIES -->

    <!-- System binaries -->
    <directories check_all="yes">/usr/bin</directories>
    <directories check_all="yes">/usr/sbin</directories>
    <directories check_all="yes">/bin</directories>
    <directories check_all="yes">/sbin</directories>

    <!-- System configuration -->
    <directories check_all="yes" realtime="yes">/etc/sudoers</directories>
    <directories check_all="yes" realtime="yes">/etc/sudoers.d</directories>
    <directories check_all="yes" realtime="yes">/etc/passwd</directories>
    <directories check_all="yes" realtime="yes">/etc/shadow</directories>
    <directories check_all="yes" realtime="yes">/etc/group</directories>
    <directories check_all="yes" realtime="yes">/etc/hosts</directories>
    <directories check_all="yes" realtime="yes">/etc/resolv.conf</directories>

    <!-- SSH configuration -->
    <directories check_all="yes" realtime="yes">/etc/ssh</directories>
    <directories check_all="yes" realtime="yes">/root/.ssh</directories>
    <directories check_all="yes" realtime="yes">/home/*/.ssh</directories>

    <!-- Systemd services (Linux) -->
    <directories check_all="yes" realtime="yes">/etc/systemd/system</directories>
    <directories check_all="yes" realtime="yes">/lib/systemd/system</directories>

    <!-- Launch agents/daemons (Mac) -->
    <directories check_all="yes" realtime="yes">/Library/LaunchAgents</directories>
    <directories check_all="yes" realtime="yes">/Library/LaunchDaemons</directories>
    <directories check_all="yes" realtime="yes">/System/Library/LaunchAgents</directories>
    <directories check_all="yes" realtime="yes">/System/Library/LaunchDaemons</directories>

    <!-- Cron jobs -->
    <directories check_all="yes" realtime="yes">/etc/cron.d</directories>
    <directories check_all="yes" realtime="yes">/etc/cron.daily</directories>
    <directories check_all="yes" realtime="yes">/etc/cron.hourly</directories>
    <directories check_all="yes" realtime="yes">/var/spool/cron</directories>

    <!-- Application directories -->
    <directories check_all="yes">/opt</directories>
    <directories check_all="yes">/usr/local/bin</directories>

    <!-- WINDOWS DIRECTORIES -->

    <!-- Windows system directories -->
    <directories check_all="yes">C:\Windows\System32</directories>
    <directories check_all="yes">C:\Windows\SysWOW64</directories>
    <directories check_all="yes" realtime="yes">C:\Windows\System32\drivers</directories>

    <!-- Windows startup locations -->
    <directories check_all="yes" realtime="yes">C:\ProgramData\Microsoft\Windows\Start Menu\Programs\Startup</directories>
    <directories check_all="yes" realtime="yes">C:\Users\*\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup</directories>

    <!-- Windows scheduled tasks -->
    <directories check_all="yes" realtime="yes">C:\Windows\System32\Tasks</directories>

    <!-- Windows important registry locations (monitored via Windows registry monitoring) -->
    <windows_registry arch="both">HKEY_LOCAL_MACHINE\Software\Microsoft\Windows\CurrentVersion\Run</windows_registry>
    <windows_registry arch="both">HKEY_LOCAL_MACHINE\Software\Microsoft\Windows\CurrentVersion\RunOnce</windows_registry>
    <windows_registry arch="both">HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Run</windows_registry>
    <windows_registry arch="both">HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\RunOnce</windows_registry>
    <windows_registry>HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services</windows_registry>
    <windows_registry>HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon</windows_registry>

    <!-- Ignore temporary and frequently changing files -->
    <ignore>/etc/mtab</ignore>
    <ignore>/etc/hosts.deny</ignore>
    <ignore>/etc/mail/statistics</ignore>
    <ignore>/etc/random-seed</ignore>
    <ignore>/etc/adjtime</ignore>
    <ignore>/etc/dnf</ignore>
    <ignore>/etc/prelink.cache</ignore>
    <ignore type="sregex">.log$|.tmp$|.cache$</ignore>

    <!-- Windows temporary files -->
    <ignore type="sregex">C:\\Windows\\Temp</ignore>
    <ignore type="sregex">C:\\Users\\.*\\AppData\\Local\\Temp</ignore>
  </syscheck>

  <!-- ========================================
       ROOTCHECK / MALWARE DETECTION
       ======================================== -->

  <rootcheck>
    <disabled>no</disabled>
    <frequency>43200</frequency> <!-- Every 12 hours -->

    <!-- Linux/Mac checks -->
    <check_dev>yes</check_dev>
    <check_files>yes</check_files>
    <check_if>yes</check_if>
    <check_pids>yes</check_pids>
    <check_ports>yes</check_ports>
    <check_sys>yes</check_sys>
    <check_trojans>yes</check_trojans>
    <check_unixaudit>yes</check_unixaudit>

    <!-- Windows checks -->
    <check_winapps>yes</check_winapps>
    <check_winaudit>yes</check_winaudit>
    <check_winmalware>yes</check_winmalware>
  </rootcheck>

  <!-- ========================================
       SECURITY CONFIGURATION ASSESSMENT
       ======================================== -->

  <sca>
    <enabled>yes</enabled>
    <scan_on_start>yes</scan_on_start>
    <interval>12h</interval>
    <skip_nfs>yes</skip_nfs>

    <policies>
      <!-- Linux policies -->
      <policy>cis_debian_linux.yml</policy>
      <policy>cis_ubuntu.yml</policy>
      <policy>cis_rhel7_linux.yml</policy>
      <policy>cis_rhel8_linux.yml</policy>

      <!-- Mac policies -->
      <policy>cis_apple_macOS_10.15.yml</policy>
      <policy>cis_apple_macOS_11.0.yml</policy>
      <policy>cis_apple_macOS_12.0.yml</policy>

      <!-- Windows policies -->
      <policy>cis_win10_enterprise.yml</policy>
      <policy>cis_win11_enterprise.yml</policy>
      <policy>cis_win2019_memberserver.yml</policy>
      <policy>cis_win2022_memberserver.yml</policy>
    </policies>
  </sca>

  <!-- ========================================
       SYSTEM INVENTORY
       ======================================== -->

  <wodle name="syscollector">
    <disabled>no</disabled>
    <interval>2h</interval> <!-- Less frequent for endpoints -->
    <network>yes</network>
    <os>yes</os>
    <packages>yes</packages>
    <ports all="yes">yes</ports>
    <processes>yes</processes>
    <hotfixes>yes</hotfixes>
  </wodle>

  <!-- ========================================
       VULNERABILITY DETECTION
       ======================================== -->

  <wodle name="vulnerability-detector">
    <disabled>no</disabled>
    <interval>12h</interval> <!-- Less frequent for endpoints -->
    <run_on_start>no</run_on_start> <!-- Don't scan on boot to avoid slowing down startup -->
    <ignore_time>12h</ignore_time>
  </wodle>

  <!-- ========================================
       OSQUERY INTEGRATION
       ======================================== -->

  <wodle name="osquery">
    <disabled>no</disabled>
    <run_daemon>yes</run_daemon>
    <log_path>/var/log/osquery/osqueryd.results.log</log_path>
    <config_path>/etc/osquery/osquery.conf</config_path>
    <add_labels>yes</add_labels>
  </wodle>

  <!-- ========================================
       CUSTOM MONITORING COMMANDS
       ======================================== -->

  <wodle name="command">
    <!-- Monitor USB devices (Linux) -->
    <disabled>no</disabled>
    <tag>usb_devices</tag>
    <command>lsusb 2>/dev/null</command>
    <interval>2m</interval>
    <ignore_output>no</ignore_output>
    <run_on_start>yes</run_on_start>
    <timeout>30</timeout>
  </wodle>

  <wodle name="command">
    <!-- Monitor network connections -->
    <disabled>no</disabled>
    <tag>network_connections</tag>
    <command>netstat -nputw 2>/dev/null | grep ESTABLISHED || netstat -an | findstr ESTABLISHED</command>
    <interval>5m</interval>
    <ignore_output>no</ignore_output>
    <run_on_start>yes</run_on_start>
    <timeout>60</timeout>
  </wodle>

  <wodle name="command">
    <!-- Monitor listening ports -->
    <disabled>no</disabled>
    <tag>listening_ports</tag>
    <command>netstat -tulpn 2>/dev/null || netstat -an | findstr LISTENING</command>
    <interval>10m</interval>
    <ignore_output>no</ignore_output>
    <run_on_start>yes</run_on_start>
    <timeout>60</timeout>
  </wodle>

  <wodle name="command">
    <!-- Monitor running processes (sample) -->
    <disabled>no</disabled>
    <tag>running_processes</tag>
    <command>ps aux 2>/dev/null | head -50 || tasklist /FO CSV 2>NUL | findstr /V "INFO:"</command>
    <interval>10m</interval>
    <ignore_output>no</ignore_output>
    <run_on_start>yes</run_on_start>
    <timeout>60</timeout>
  </wodle>

  <wodle name="command">
    <!-- Monitor failed login attempts (Linux) -->
    <disabled>no</disabled>
    <tag>failed_logins</tag>
    <command>grep "Failed password" /var/log/auth.log 2>/dev/null | tail -20</command>
    <interval>10m</interval>
    <ignore_output>no</ignore_output>
    <run_on_start>yes</run_on_start>
    <timeout>60</timeout>
  </wodle>

  <wodle name="command">
    <!-- Monitor sudo usage (Linux/Mac) -->
    <disabled>no</disabled>
    <tag>sudo_usage</tag>
    <command>grep "sudo:" /var/log/auth.log 2>/dev/null | tail -20</command>
    <interval>10m</interval>
    <ignore_output>no</ignore_output>
    <run_on_start>yes</run_on_start>
    <timeout>60</timeout>
  </wodle>

  <wodle name="command">
    <!-- Monitor disk space -->
    <disabled>no</disabled>
    <tag>disk_usage</tag>
    <command>df -h 2>/dev/null || wmic logicaldisk get size,freespace,caption 2>NUL</command>
    <interval>30m</interval>
    <ignore_output>no</ignore_output>
    <run_on_start>yes</run_on_start>
    <timeout>60</timeout>
  </wodle>

  <wodle name="command">
    <!-- Monitor wireless networks (Linux/Mac) -->
    <disabled>no</disabled>
    <tag>wifi_networks</tag>
    <command>nmcli dev wifi list 2>/dev/null || iwlist scan 2>/dev/null | grep ESSID</command>
    <interval>10m</interval>
    <ignore_output>no</ignore_output>
    <run_on_start>yes</run_on_start>
    <timeout>60</timeout>
  </wodle>

  <wodle name="command">
    <!-- Monitor installed applications (Windows) -->
    <disabled>no</disabled>
    <tag>installed_apps_windows</tag>
    <command>wmic product get name,version 2>NUL</command>
    <interval>6h</interval>
    <ignore_output>no</ignore_output>
    <run_on_start>no</run_on_start>
    <timeout>120</timeout>
  </wodle>

  <wodle name="command">
    <!-- Monitor Windows Defender status -->
    <disabled>no</disabled>
    <tag>defender_status</tag>
    <command>powershell.exe -Command "Get-MpComputerStatus | Select-Object AntivirusEnabled,RealTimeProtectionEnabled,IoavProtectionEnabled,BehaviorMonitorEnabled" 2>NUL</command>
    <interval>1h</interval>
    <ignore_output>no</ignore_output>
    <run_on_start>yes</run_on_start>
    <timeout>60</timeout>
  </wodle>

  <wodle name="command">
    <!-- Monitor system uptime -->
    <disabled>no</disabled>
    <tag>system_uptime</tag>
    <command>uptime 2>/dev/null || net statistics workstation 2>NUL | findstr "Statistics"</command>
    <interval>1h</interval>
    <ignore_output>no</ignore_output>
    <run_on_start>yes</run_on_start>
    <timeout>30</timeout>
  </wodle>

  <!-- ========================================
       ACTIVE RESPONSE
       ======================================== -->

  <active-response>
    <!-- Enable active response for endpoints -->
    <disabled>no</disabled>
    <ca_store>/var/ossec/etc/wpk_root.pem</ca_store>
    <ca_verification>yes</ca_verification>
  </active-response>

  <!-- Active response commands -->
  <command>
    <name>firewall-drop</name>
    <executable>firewall-drop</executable>
    <timeout_allowed>yes</timeout_allowed>
  </command>

  <command>
    <name>disable-account</name>
    <executable>disable-account</executable>
    <timeout_allowed>yes</timeout_allowed>
  </command>

  <command>
    <name>restart-wazuh</name>
    <executable>restart-wazuh</executable>
    <timeout_allowed>no</timeout_allowed>
  </command>

  <!-- Active response rules -->
  <active-response>
    <!-- Block SSH brute force (Linux/Mac) -->
    <command>firewall-drop</command>
    <location>local</location>
    <rules_id>5710,5711,5712,5720</rules_id>
    <timeout>600</timeout> <!-- 10 minutes -->
  </active-response>

  <active-response>
    <!-- Block RDP brute force (Windows) -->
    <command>firewall-drop</command>
    <location>local</location>
    <rules_id>60122,60204</rules_id>
    <timeout>600</timeout>
  </active-response>

  <active-response>
    <!-- Block malware/suspicious processes -->
    <command>firewall-drop</command>
    <location>local</location>
    <rules_id>550,551,552,553,554</rules_id> <!-- Rootcheck alerts -->
    <timeout>0</timeout> <!-- Permanent until manually removed -->
  </active-response>

  <active-response>
    <!-- Disable compromised accounts -->
    <command>disable-account</command>
    <location>local</location>
    <rules_id>5503,5504</rules_id>
    <timeout>1800</timeout> <!-- 30 minutes -->
  </active-response>

  <!-- ========================================
       LABELS
       ======================================== -->

  <labels>
    <label key="device_type">endpoint</label>
    <label key="form_factor">laptop</label>
    <label key="criticality">medium</label>
    <label key="environment">corporate</label>
    <label key="user_device">true</label>
  </labels>
</agent_config>
