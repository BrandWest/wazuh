<!-- Wazuh Agent Configuration for Kubernetes Containers -->
<agent_config>
  <!-- Profile for containerized workloads -->
  <profile>kubernetes,container</profile>

  <client_buffer>
    <!-- Higher buffer for container log volume -->
    <disabled>no</disabled>
    <queue_size>10000</queue_size>
    <events_per_second>500</events_per_second>
  </client_buffer>

  <localfile>
    <!-- Container stdout/stderr logs -->
    <log_format>json</log_format>
    <location>/var/log/containers/*.log</location>
  </localfile>

  <localfile>
    <!-- Kubernetes audit logs -->
    <log_format>json</log_format>
    <location>/var/log/kubernetes/audit.log</location>
  </localfile>

  <localfile>
    <!-- kubelet logs -->
    <log_format>syslog</log_format>
    <location>/var/log/kubelet.log</location>
  </localfile>

  <localfile>
    <!-- kube-apiserver logs -->
    <log_format>json</log_format>
    <location>/var/log/kube-apiserver.log</location>
  </localfile>

  <localfile>
    <!-- Docker daemon logs -->
    <log_format>json</log_format>
    <location>/var/log/docker.log</location>
  </localfile>

  <localfile>
    <!-- containerd logs -->
    <log_format>syslog</log_format>
    <location>/var/log/containerd.log</location>
  </localfile>

  <syscheck>
    <!-- File integrity monitoring for container runtime -->
    <disabled>no</disabled>
    <frequency>21600</frequency> <!-- Every 6 hours -->
    <scan_on_start>yes</scan_on_start>

    <!-- Kubernetes configuration files -->
    <directories check_all="yes" realtime="yes">/etc/kubernetes</directories>

    <!-- Container runtime configs -->
    <directories check_all="yes" realtime="yes">/etc/docker</directories>
    <directories check_all="yes" realtime="yes">/etc/containerd</directories>

    <!-- Critical system binaries -->
    <directories check_all="yes">/usr/bin/kubelet</directories>
    <directories check_all="yes">/usr/bin/kubectl</directories>
    <directories check_all="yes">/usr/bin/docker</directories>
    <directories check_all="yes">/usr/bin/containerd</directories>

    <!-- Service files -->
    <directories check_all="yes" realtime="yes">/etc/systemd/system/kubelet.service</directories>
    <directories check_all="yes" realtime="yes">/etc/systemd/system/docker.service</directories>

    <!-- Ignore frequently changing directories -->
    <ignore>/etc/kubernetes/manifests</ignore>
    <ignore>/etc/kubernetes/pki/tokens</ignore>
  </syscheck>

  <rootcheck>
    <!-- Rootkit detection -->
    <disabled>no</disabled>
    <frequency>86400</frequency> <!-- Daily -->
    <check_dev>yes</check_dev>
    <check_files>yes</check_files>
    <check_if>yes</check_if>
    <check_pids>yes</check_pids>
    <check_ports>yes</check_ports>
    <check_sys>yes</check_sys>
    <check_trojans>yes</check_trojans>
  </rootcheck>

  <sca>
    <!-- CIS Kubernetes Benchmark -->
    <enabled>yes</enabled>
    <scan_on_start>yes</scan_on_start>
    <interval>12h</interval>
    <skip_nfs>yes</skip_nfs>

    <policies>
      <policy>cis_kubernetes.yml</policy>
      <policy>cis_docker.yml</policy>
    </policies>
  </sca>

  <wodle name="syscollector">
    <!-- System inventory -->
    <disabled>no</disabled>
    <interval>1h</interval>
    <network>yes</network>
    <os>yes</os>
    <packages>yes</packages>
    <ports all="yes">yes</ports>
    <processes>yes</processes>
  </wodle>

  <wodle name="vulnerability-detector">
    <!-- Vulnerability scanning for container images -->
    <disabled>no</disabled>
    <interval>6h</interval>
    <run_on_start>yes</run_on_start>
  </wodle>

  <wodle name="docker-listener">
    <!-- Docker events monitoring -->
    <disabled>no</disabled>
    <interval>10m</interval>
    <attempts>5</attempts>
    <run_on_start>yes</run_on_start>
  </wodle>

  <wodle name="command">
    <!-- Monitor running containers -->
    <disabled>no</disabled>
    <tag>docker_ps</tag>
    <command>docker ps --format '{{json .}}'</command>
    <interval>2m</interval>
    <ignore_output>no</ignore_output>
    <run_on_start>yes</run_on_start>
    <timeout>60</timeout>
  </wodle>

  <wodle name="command">
    <!-- Monitor Kubernetes pods -->
    <disabled>no</disabled>
    <tag>kubectl_pods</tag>
    <command>kubectl get pods --all-namespaces -o json</command>
    <interval>2m</interval>
    <ignore_output>no</ignore_output>
    <run_on_start>yes</run_on_start>
    <timeout>60</timeout>
  </wodle>

  <wodle name="command">
    <!-- Monitor privileged containers -->
    <disabled>no</disabled>
    <tag>privileged_containers</tag>
    <command>docker ps -q | xargs docker inspect --format '{{.Id}}:{{.HostConfig.Privileged}}'</command>
    <interval>5m</interval>
    <ignore_output>no</ignore_output>
    <run_on_start>yes</run_on_start>
    <timeout>60</timeout>
  </wodle>

  <wodle name="osquery">
    <!-- osquery for container forensics -->
    <disabled>no</disabled>
    <run_daemon>yes</run_daemon>
    <log_path>/var/log/osquery/osqueryd.results.log</log_path>
    <config_path>/etc/osquery/osquery.conf</config_path>
    <add_labels>yes</add_labels>
  </wodle>

  <active-response>
    <!-- Active response for containers -->
    <disabled>no</disabled>
    <ca_store>/var/ossec/etc/wpk_root.pem</ca_store>
    <ca_verification>yes</ca_verification>
  </active-response>

  <labels>
    <label key="device_type">kubernetes</label>
    <label key="workload_type">container</label>
    <label key="criticality">high</label>
    <label key="environment">production</label>
  </labels>
</agent_config>
