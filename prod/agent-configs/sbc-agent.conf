<!-- Wazuh Agent Configuration for Single Board Computers (Raspberry Pi, ZimaBlades) -->
<agent_config>
  <!-- Profile for SBC devices -->
  <profile>sbc,raspberry-pi</profile>

  <client_buffer>
    <!-- Reduced buffer for limited resources -->
    <disabled>no</disabled>
    <queue_size>2500</queue_size>
    <events_per_second>100</events_per_second>
  </client_buffer>

  <localfile>
    <!-- System logs -->
    <log_format>syslog</log_format>
    <location>/var/log/syslog</location>
  </localfile>

  <localfile>
    <!-- Authentication logs -->
    <log_format>syslog</log_format>
    <location>/var/log/auth.log</location>
  </localfile>

  <localfile>
    <!-- Kernel messages -->
    <log_format>syslog</log_format>
    <location>/var/log/kern.log</location>
  </localfile>

  <localfile>
    <!-- Application logs -->
    <log_format>syslog</log_format>
    <location>/var/log/messages</location>
  </localfile>

  <localfile>
    <!-- Docker logs (if running containers) -->
    <log_format>json</log_format>
    <location>/var/lib/docker/containers/*/*.log</location>
  </localfile>

  <syscheck>
    <!-- Lightweight file integrity monitoring -->
    <disabled>no</disabled>
    <frequency>86400</frequency> <!-- Daily to reduce CPU usage -->
    <scan_on_start>yes</scan_on_start>

    <!-- Critical system directories -->
    <directories check_all="yes">/etc</directories>
    <directories check_all="yes">/usr/bin</directories>
    <directories check_all="yes">/usr/sbin</directories>
    <directories check_all="yes">/bin</directories>
    <directories check_all="yes">/sbin</directories>
    <directories check_all="yes">/boot</directories>

    <!-- Home directories for IoT applications -->
    <directories check_all="yes" realtime="no">/home</directories>
    <directories check_all="yes" realtime="no">/opt</directories>

    <!-- Ignore temp and cache -->
    <ignore>/etc/mtab</ignore>
    <ignore>/etc/hosts.deny</ignore>
    <ignore>/etc/mail/statistics</ignore>
    <ignore>/etc/random-seed</ignore>
    <ignore>/etc/adjtime</ignore>
  </syscheck>

  <rootcheck>
    <!-- Rootkit detection - less frequent for SBCs -->
    <disabled>no</disabled>
    <frequency>172800</frequency> <!-- Every 2 days -->
  </rootcheck>

  <sca>
    <!-- Security configuration assessment -->
    <enabled>yes</enabled>
    <scan_on_start>yes</scan_on_start>
    <interval>24h</interval>
    <skip_nfs>yes</skip_nfs>
  </sca>

  <wodle name="syscollector">
    <!-- System inventory - less frequent for resource constraints -->
    <disabled>no</disabled>
    <interval>6h</interval>
    <network>yes</network>
    <os>yes</os>
    <packages>yes</packages>
    <ports all="yes">yes</ports>
    <processes>no</processes> <!-- Disabled to reduce overhead -->
  </wodle>

  <wodle name="vulnerability-detector">
    <!-- Vulnerability scanning -->
    <disabled>no</disabled>
    <interval>24h</interval>
    <run_on_start>no</run_on_start> <!-- Don't scan on start to reduce boot load -->
  </wodle>

  <wodle name="command">
    <!-- Monitor CPU temperature (Raspberry Pi specific) -->
    <disabled>no</disabled>
    <tag>rpi_temp</tag>
    <command>/usr/bin/vcgencmd measure_temp</command>
    <interval>5m</interval>
    <ignore_output>no</ignore_output>
    <run_on_start>yes</run_on_start>
    <timeout>30</timeout>
  </wodle>

  <wodle name="command">
    <!-- Monitor throttling status (Raspberry Pi specific) -->
    <disabled>no</disabled>
    <tag>rpi_throttle</tag>
    <command>/usr/bin/vcgencmd get_throttled</command>
    <interval>5m</interval>
    <ignore_output>no</ignore_output>
    <run_on_start>yes</run_on_start>
    <timeout>30</timeout>
  </wodle>

  <wodle name="osquery">
    <!-- osquery integration for detailed monitoring -->
    <disabled>no</disabled>
    <run_daemon>yes</run_daemon>
    <log_path>/var/log/osquery/osqueryd.results.log</log_path>
    <config_path>/etc/osquery/osquery.conf</config_path>
    <add_labels>yes</add_labels>
  </wodle>

  <active-response>
    <!-- Enable active response for SBCs -->
    <disabled>no</disabled>
    <ca_store>/var/ossec/etc/wpk_root.pem</ca_store>
    <ca_verification>yes</ca_verification>
  </active-response>

  <labels>
    <label key="device_type">sbc</label>
    <label key="criticality">medium</label>
    <label key="resource_constrained">true</label>
  </labels>
</agent_config>
